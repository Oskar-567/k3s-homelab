---
- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write k3s server configuration
  ansible.builtin.copy:
    src: config.yaml
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  register: k3s_config

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s server (only if not already present)
  ansible.builtin.shell: >
    set -o pipefail &&
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists
  changed_when: true

- name: Restart k3s if its configuration changed on an existing install
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
  when: k3s_binary.stat.exists and k3s_config is changed

- name: Ensure k3s is running and enabled
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true

- name: Wait for the node to become Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=300s
  changed_when: false
