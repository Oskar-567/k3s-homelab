# Template - copy to inventory.local.ini (gitignored) and fill in real values.
[k3s_server]
raspberry4b ansible_host=<PI-IP> ansible_user=<your-user>

[k3s_agent]
# Add future worker nodes here:
# worker1 ansible_host=192.168.xxx.xxx ansible_user=<your-user>

[all:vars]
k3s_server_ip=<PI-IP>
# Only needed if the WSL key differs from the key given to Raspberry Pi Imager:
# ansible_ssh_private_key_file=~/.ssh/id_ed25519_pi
# Fail after ~2 min instead of hanging if the connection dies (e.g. network restart during apt upgrade)
ansible_ssh_common_args='-o ServerAliveInterval=30 -o ServerAliveCountMax=4'
